<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ZONA Launcher</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 20px; background: #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
    main { flex: 1; display: flex; padding: 20px; gap: 20px; }
    .panel { flex: 1; background: #1a1a1a; border-radius: 8px; padding: 16px; }
    footer { padding: 12px 20px; background: #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
    button { padding: 10px 20px; font-size: 14px; cursor: pointer; }
    #progress { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 8px; }
    #progress-bar { height: 100%; background: #4caf50; width: 0%; }
    select { padding: 6px; }
  </style>
</head>
<body>
  <header>
    <h2>ZONA Launcher</h2>
    <div>
      <label>Channel:
        <select id="channel">
          <option value="stable">stable</option>
          <option value="dev">dev</option>
        </select>
      </label>
    </div>
  </header>
  <main>
    <div class="panel">
      <h3>News</h3>
      <p id="news">Loading news...</p>
    </div>
    <div class="panel">
      <h3>Status</h3>
      <p id="status">Ready</p>
      <div id="progress"><div id="progress-bar"></div></div>
      <p id="progress-text"></p>
      <button id="update">Download / Update</button>
      <button id="play">Play</button>
    </div>
  </main>
  <footer>
    <span id="version">v0.0.0</span>
    <span id="local-version"></span>
    <span>Install dir: <span id="install-dir"></span> <button id="change-dir">Change</button></span>
    <label>Server: <input id="server" value="192.168.0.47" style="width:160px" /></label>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
