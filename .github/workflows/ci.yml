name: CI
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

jobs:
  build-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build
        run: cargo build --workspace

  build-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: launcher
        run: npm ci
      - name: Build
        working-directory: launcher
        run: npm run build
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build-rust, build-launcher]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --workspace --release
      - name: Create manifest
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $base = "https://github.com/Otakyooo/zona_engine/releases/download/$tag"
          $files = @()
          Get-ChildItem target\release\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $files += @{ path = $_.Name; url = "$base/$($_.Name)"; sha256 = $hash; size = $_.Length }
          }
          @{ version = $tag; files = $files } | ConvertTo-Json -Depth 3 | Out-File launcher/manifest.json -Encoding utf8
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/zn-client.exe
            target/release/zn-server.exe
            target/release/zn-editor.exe
            launcher/dist/*
            launcher/manifest.json
