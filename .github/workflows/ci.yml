name: CI
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

env:
  # Память проекта: без этого сборка виснет на zn-physics (PITFALLS.md).
  CARGO_INCREMENTAL: '0'

jobs:
  build-rust:
    runs-on: windows-latest
    outputs:
      test_count: ${{ steps.tests.outputs.count }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Versions
        run: node ci/check-versions.js
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace
      # Считаем тесты здесь, где уже есть toolchain и тёплый target/.
      # self-check получает число через output и не запускает cargo второй раз.
      - name: Count tests
        id: tests
        shell: pwsh
        run: |
          $lines = cargo test --workspace -- --list
          $n = @($lines | Where-Object { $_ -match ':\s*test\s*$' }).Count
          if ($n -eq 0) { throw "[self-check] не удалось сосчитать тесты" }
          "count=$n" >> $env:GITHUB_OUTPUT

  build-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install
        working-directory: launcher
        run: npm ci
      - name: Audit (prod only)
        working-directory: launcher
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --publish never
      - name: Upload launcher
        uses: actions/upload-artifact@v7.0.2
        with:
          name: launcher-dist
          path: launcher/dist
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Релиз игры не должен зависеть от сборки Electron-лаунчера.
    needs: [build-rust]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --workspace --release
      - name: Stage dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/zn-client.exe dist/
          Copy-Item target/release/zn-server.exe dist/
          if (Test-Path target/release/editor.exe) { Copy-Item target/release/editor.exe dist/ }
          if (Test-Path target/release/zn-baker.exe) { Copy-Item target/release/zn-baker.exe dist/ }
          # Ресурсы обязательны: без них клиент рисует заглушку и белые текстуры.
          Copy-Item -Recurse assets dist/assets
          Copy-Item -Recurse maps dist/maps
      - name: Create manifest
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $base = "https://github.com/Otakyooo/zona_engine/releases/download/$tag"
          $root = (Resolve-Path dist).Path
          $files = @()
          Get-ChildItem dist -Recurse -File | Where-Object { $_.Name -ne 'manifest.json' } | ForEach-Object {
            # Substring вместо [IO.Path]::GetRelativePath: он есть только в PowerShell 7.
            $rel = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
            # GitHub не принимает слэши в именах ассетов, поэтому файл в релизе
            # плоский, а вложенный путь живёт только в поле path — лаунчер сам
            # создаст каталоги при распаковке.
            $asset = $_.Name
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $files += @{ path = $rel; url = "$base/$asset"; sha256 = $hash; size = $_.Length }
          }
          @{ version = $tag; files = $files } | ConvertTo-Json -Depth 3 | Out-File dist/manifest.json -Encoding utf8
      - name: GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/**

  # Петля уробороса: сгенерированные документы коммитятся только при реальном
  # diff и с [skip ci], иначе «коммит -> CI -> коммит» зациклится.
  self-check:
    needs: [build-rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit != null && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: windows-latest
    concurrency:
      group: self-check-main
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      ZONA_TEST_COUNT: ${{ needs.build-rust.outputs.test_count }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify and generate
        run: node ci/self-check.js --verify --generate
      - name: Commit generated docs
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md CHANGELOG.md ci/artifacts/tests.json
          # git diff --name-only всегда возвращает 0: так шаг не упадёт из-за
          # $PSNativeCommandUseErrorActionPreference в pwsh.
          $changed = git diff --cached --name-only
          if ([string]::IsNullOrWhiteSpace($changed)) {
            Write-Host "[self-check] generated docs unchanged"
            exit 0
          }
          git commit -m "docs(roadmap): regenerate from artifacts [skip ci]"
          git push origin HEAD:main
