name: CI
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

jobs:
  build-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Versions
        run: node ci/check-versions.js
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build
        run: cargo build --workspace

  build-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install
        working-directory: launcher
        run: npm ci
      - name: Audit (prod only)
        working-directory: launcher
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --publish never
      - name: Upload launcher
        uses: actions/upload-artifact@v7.0.2
        with:
          name: launcher-dist
          path: launcher/dist
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Релиз игры не должен зависеть от сборки Electron-лаунчера.
    needs: [build-rust]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --workspace --release
      - name: Stage dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/zn-client.exe dist/
          Copy-Item target/release/zn-server.exe dist/
          if (Test-Path target/release/editor.exe) { Copy-Item target/release/editor.exe dist/ }
          if (Test-Path target/release/zn-baker.exe) { Copy-Item target/release/zn-baker.exe dist/ }
          # Ресурсы обязательны: без них клиент рисует заглушку и белые текстуры.
          Copy-Item -Recurse assets dist/assets
          Copy-Item -Recurse maps dist/maps
      - name: Create manifest
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $base = "https://github.com/Otakyooo/zona_engine/releases/download/$tag"
          $root = (Resolve-Path dist).Path
          $files = @()
          Get-ChildItem dist -Recurse -File | Where-Object { $_.Name -ne 'manifest.json' } | ForEach-Object {
            # Substring вместо [IO.Path]::GetRelativePath: он есть только в PowerShell 7.
            $rel = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
            # GitHub не принимает слэши в именах ассетов, поэтому файл в релизе
            # плоский, а вложенный путь живёт только в поле path — лаунчер сам
            # создаст каталоги при распаковке.
            $asset = $_.Name
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $files += @{ path = $rel; url = "$base/$asset"; sha256 = $hash; size = $_.Length }
          }
          @{ version = $tag; files = $files } | ConvertTo-Json -Depth 3 | Out-File dist/manifest.json -Encoding utf8
      - name: GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/**
